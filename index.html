        <section id="insights">
          <h2 id="insights-heading">Answers for Local Growth</h2>
          <article>
            <h3>What does a UI/UX design agency do?</h3>
            <p>A UI/UX design agency creates websites and mobile apps that feel simple and clear to use. The team studies real buyers, plans page layouts, and tests clean screens. These user-friendly digital tools help local businesses hold customer interest, gain new inquiries, and turn more visitors into paying buyers every day.</p>
          </article>
          <article>
            <h3>How do I get my business online in Sri Lanka?</h3>
            <p>Getting your business online in Sri Lanka starts with a good web address and a fast mobile website. Next, add a direct WhatsApp chat link and simple local payment choices. Finally, set up your Google Business Profile and local search tags so buyers near you can find your shop quickly.</p>
          </article>
          <article>
            <h3>Why should Sri Lankan SMEs invest in custom web design?</h3>
            <p>Custom web design gives Sri Lankan small businesses a unique look that standard site templates cannot match. Custom pages load much faster on mobile phones, rank higher on search engines, and match local buyer habits. A custom site builds strong trust with clients and brings steady calls and visits.</p>
          </article>
          <article>
            <h3>What is ROP, NAXIT's retail operations platform?</h3>
            <p>ROP is a simple retail platform made by NAXIT for Sri Lankan shops, mini-marts, and distributors. It tracks daily shelf stock, creates quick sales receipts, and tracks supplier bills in one easy screen. ROP works on basic computers and tablets without complex setups or high monthly fees.</p>
          </article>

          <h3 id="how-to-launch-website">How to Launch a Successful Business Website in 5 Steps</h3>
          <ol>
            <li><strong>Set Goals and Buyer Needs:</strong> Pick what your site must do and who you want to reach across Sri Lanka.</li>
            <li><strong>Plan Your Site Pages:</strong> List your main services, authentic photos, and direct WhatsApp buttons.</li>
            <li><strong>Build Clean Screen Layouts:</strong> Ensure layouts look sharp on budget smartphones and desktop screens.</li>
            <li><strong>Code for Speed and SEO:</strong> Keep pages lightweight, mobile-optimized, and clear for search engines.</li>
            <li><strong>Go Live and Share Your Link:</strong> Publish on your custom domain, connect Google Maps, and track visitors.</li>
          </ol>
